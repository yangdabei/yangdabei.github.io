name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - ".gitmodules"
      - "assets/**"
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "hugo.toml"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - ".gitmodules"
      - "assets/**"
      - "content/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - "hugo.toml"
  workflow_dispatch:

permissions:
  contents: write

env:
  HUGO_VERSION: "0.164.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        shell: bash
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: hugo --gc --minify --destination _site

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
