name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]

env:
  HUGO_VERSION: "0.164.0"

jobs:
  check-links-on-site:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        shell: bash
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: hugo --gc --minify --destination _site

      - name: Check local links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: --offline --verbose --no-progress '_site/**/*.html'
